name: MOsu Release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. 1.0.10)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create MOsu Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build MOsu
        run: dotnet build osu.Game.Rulesets.MOsu/osu.Game.Rulesets.MOsu.csproj -c Release

      - name: Generate changelog
        run: |
          tag_name="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          prev_tag=$(git tag --sort=-creatordate | grep -v "^$tag_name$" | head -1)
          osu_version=$(git -C osu describe --tags --abbrev=0)

          if [ -n "$prev_tag" ]; then
            changes=$(git log "$prev_tag..$tag_name" --oneline --no-merges)
          else
            changes=$(git log --oneline --no-merges)
          fi

          if [[ "$tag_name" == *tachyon* ]]; then
            {
              echo "Builds on the osu! version: [$osu_version](https://github.com/ppy/osu/releases/tag/$osu_version)"
              echo "**ONLY INSTALL THIS IF YOU'RE ON the $osu_version or newer** if you're on a lazer stable version install latest without -tachyon."
            } > /tmp/changelog.md
          else
            {
              echo "Builds on the osu! version: [$osu_version](https://github.com/ppy/osu/releases/tag/$osu_version)"
              echo
              echo "[How to install](https://rulesets.info/install/rulesets)"
              echo
              echo "## Install"
              echo "### 1. Navigate to osu! data directory"
              echo 'In osu!lazer, open Settings → General → **Open osu! folder**.'
              echo "On Windows the default rulesets path is ``%AppData%/osu!/rulesets``."
              echo "On macOS the default location is inside the application itself."
              echo "### 2. Install the ruleset"
              echo "Copy the downloaded **.dll** file into the **rulesets** directory."
              echo "Overwrite any duplicate copies of the ruleset if prompted."
              echo "### 3. Have fun!"
              echo "Restart osu!lazer if it is already open. The ruleset appears alongside the standard rulesets."
            } > /tmp/changelog.md
          fi

          {
            echo
            echo "## Changes"
            echo "$changes"
          } >> /tmp/changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name || github.event.inputs.tag }}"
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          body_path: /tmp/changelog.md
          files: osu.Game.Rulesets.MOsu/bin/Release/net8.0/osu.Game.Rulesets.MOsu.dll
          draft: false
          prerelease: ${{ contains(github.ref_name || github.event.inputs.tag, 'tachyon') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
